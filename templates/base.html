<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel ="icon" href="{% static 'image/favicon.ico'%}" type="image/gif" sizes="16x16">


    {% block title %}
    {% endblock title %}  
    
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <a class="navbar-brand" href="{% url 'index' %}"><img src="{% static 'image/logo.png'%}" alt="Taskmate"></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
            <a class="nav-item nav-link" href="{% url 'index' %}">Home</a>
            <a class="nav-item nav-link" href="{% url 'todolist' %}">Tododlist</a>
            <a class="nav-item nav-link" href="{% url 'contact' %}">contact</a>
            <a class="nav-item nav-link" href="{% url 'about' %}">about</a>
            </div>
        </div>
        {% if user.is_authenticated %}
          <div class ="form-inline my-2 my-lg-0">
            <div class="p-2 mb-2 bg-dark text-white"> Logged in as{{user.email}}</div>
            <a href="{{% url 'logout' %}}">
              <button class="btn btn-info my-2 my-sm-0" type="submit">Logout</button>
            </a>
          </div>
        {% else %}
           <a href="{{% url 'login' %}}">
              <button class="btn btn-success mr-2 my-2 my-sm-0" type="submit">Login</button>
            </a>
            <a href="{{% url 'register' %}}">
              <button class="btn btn-primary my-2 my-sm-0" type="submit">Register</button>
            </a>
        {% endif %}
    </nav>
  </head>
  <body class="bg-success p-2 text-dark bg-opacity-10">
  {% block content %}


    <!-- Optional JavaScript -->
    <!-- jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
  </body>
  {% endblock content %}
</html>
