{% extends 'base.html' %}

{% block title %}
    <title>Logout</title>
{% endblock %}

{% block content %}
    <div class="container">
        <h4 class="mt-5">Logged out of Taskmate. Thank you for using us!</h4>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">Login again</a>
    </div>
{% endblock content %}
